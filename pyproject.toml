[project]
name = "time-to-kill"
version = "0.1.0"
description = "Personal sports betting analytics: probability modeling, no-vig market comparison, EV, parlays, and performance tracking."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "numpy>=2.0",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "tzdata>=2024.1",  # IANA zones for zoneinfo on Windows
]

[project.scripts]
ttk = "ttk.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ttk = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*" = ["E501", "W291"]  # Alembic-generated

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
files = ["src/ttk", "tests"]
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["sklearn.*", "scipy.*"]
ignore_missing_imports = true
